services:
  - type: web
    name: bullionx-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python scripts/init_db.py && (python scripts/run_scraper.py || true) && uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.11
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: SCRAPE_INTERVAL_MINUTES
        value: "60"
      - key: CORS_ORIGINS
        sync: false