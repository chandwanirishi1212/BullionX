services:
  api:
    image: python:3.13-slim
    working_dir: /app
    command: sh -c "pip install --no-cache-dir -r backend/requirements.txt && python scripts/init_db.py && (python scripts/run_scraper.py || true) && uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: sqlite:////data/bullionx.db
      ENABLE_SCHEDULER: "true"
      CORS_ORIGINS: http://localhost:8080
    volumes:
      - ./:/app
      - bullionx-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  bullionx-data:
